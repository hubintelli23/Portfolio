<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio WebApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 상단 앱 헤더 -->
        <header class="app-header">
            <div class="header-top">
                <div class="header-content">
                    <h1>PORTFOLIO.APP</h1>
                    <p class="subtitle">Interactive Showcase & Works</p>
                </div>
                <!-- 다크/라이트 모드 토글 버튼 -->
                <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">
                    ☀️ 라이트 모드
                </button>
            </div>

            <!-- 실시간 검색창 -->
            <div class="search-container">
                <input 
                    type="text" 
                    id="search-input" 
                    class="search-input" 
                    placeholder="프로젝트 제목, 키워드, 시스템 검색..."
                >
                <button id="search-clear" class="search-clear" title="검색어 지우기">&times;</button>
            </div>

            <!-- 카테고리 필터 탭 -->
            <nav class="filter-nav" id="filter-nav">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="Game Design">Game Design</button>
                <button class="filter-btn" data-filter="Scenario">Scenario</button>
                <button class="filter-btn" data-filter="VFX & Art">VFX & Art</button>
            </nav>
        </header>

        <!-- 메인 콘텐츠 그리드 -->
        <main class="app-main">
            <div class="project-grid" id="project-grid">
                <!-- JavaScript를 통해 동적으로 카드가 렌더링됩니다 -->
            </div>
        </main>
    </div>

    <!-- 상세 보기 모달 (Modal) -->
    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal-content" id="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="modal-body">
                <!-- 모달 내용 동적 주입 -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
