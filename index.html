<!DOCTYPE html>
<!-- Portfolio index.html v1.3 (2026-11-16) : 작업물 아카이브 썸네일 수정 (CSS·JS v1.3으로 갱신)
     v1.2 : 임시 로고 6종 반영
     v1.1 : 프로젝트 바로가기(PLAY) 섹션 추가 -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Creative Showcase</title>
    <link rel="stylesheet" href="style.css?v=1.3">
</head>
<body>
    <div id="app">
        <!-- 상단 헤더 & 프로필 영역 -->
        <header class="app-header">
            <div class="header-top">
                <div class="brand-box">
                    <h1>WORKS & PORTFOLIO</h1>
                    <p class="subtitle">Game Design, Scenario, VFX & Interactive Art</p>
                </div>
                <button id="theme-toggle" class="theme-toggle" aria-label="테마 전환">☀️ 테마 변경</button>
            </div>
        </header>

        <!-- 프로젝트 바로가기 (아이콘 누르면 각 프로젝트 페이지로 이동) -->
        <section class="link-section" aria-labelledby="link-section-title">
            <h2 class="section-title" id="link-section-title">PLAY <span>프로젝트 바로가기</span></h2>
            <div class="link-grid" id="link-grid">
                <!-- 동적 렌더링 (data/links.json) -->
            </div>
        </section>

        <!-- 검색 및 카테고리 필터 -->
        <section class="works-controls">
            <h2 class="section-title">WORKS <span>작업물 아카이브</span></h2>
            <div class="controls-bar">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="작품명, 키워드, 시스템 검색...">
                    <button id="search-clear" class="search-clear">&times;</button>
                </div>
            </div>

            <nav class="filter-nav" id="filter-nav">
                <button class="filter-btn active" data-filter="all">ALL WORKS</button>
                <button class="filter-btn" data-filter="Game Design">Game Design</button>
                <button class="filter-btn" data-filter="Scenario">Scenario</button>
                <button class="filter-btn" data-filter="VFX & Art">VFX & Art</button>
            </nav>
        </section>

        <!-- 메인 쇼케이스 그리드 -->
        <main class="app-main">
            <div class="project-grid" id="project-grid">
                <!-- 동적 렌더링 -->
            </div>
        </main>
    </div>

    <!-- 상세 보기 모달 -->
    <div class="modal-backdrop" id="modal-backdrop">
        <div class="modal-content" id="modal-content">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="app.js?v=1.3"></script>
</body>
</html>
